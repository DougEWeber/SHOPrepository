---
targets:
  LIB2-ORDCHG-FILE :
    objlib: LIB2
    objname: ORDCHG
    objtype: FILE
    objattr: DSPF
    protected: no
    excluded: no
    requisites :
      -
        name: QDDSSRC
        lib: "*LIBL"
        objtype: "FILE"
        member: ORDCHG
    requisiteyamlrecords :
      - LIBL-QDDSSRC-SRCMBR-ORDCHG
    command: EDOCRTOBJ
    parameters:
      - "BLDTGT($(LIB2)/ORDCHG)"
      - "OBJTYPE(*FILE)"
      - "OBJATTR(DSPF)"
      - "CMD(CRTDSPF)"
      - "CMDPARMS(' FILE($(LIB2)/ORDCHG) SRCFILE(QDDSSRC) SRCMBR(ORDCHG) DFRWRT(*YES) RSTDSP(*NO) TEXT(''Order Change'')')"
  LIBL-QDDSSRC-SRCMBR-ORDCHG :
    objlib: "*LIBL"
    objname: QDDSSRC
    objtype: SRCMBR
    mbrname: ORDCHG
