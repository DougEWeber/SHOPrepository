---
targets:
  LIB2-POMAINT-PGM :
    objlib: LIB2
    objname: POMAINT
    objtype: PGM
    objattr: RPGLE
    protected: no
    excluded: no
    requisites :
      -
        name: POMAIN
        lib: "*LIBL"
        objtype: "MODULE"
      -
        name: POMNT
        lib: "*LIBL"
        objtype: "MODULE"
    requisiteyamlrecords :
      - LIB2-POMAIN-MODULE
      - LIB2-POMNT-MODULE
    command: CRTPGM
    parameters:
      - "PGM($(LIB2)/POMAINT)"
      - "USRPRF(*USER)"
      - "MODULE(POMAIN POMNT)"
      - "ENTMOD(POMAIN)"
      - "ACTGRP(QILE)"
      - "DETAIL(*BASIC)"
      - "ALWUPD(*YES)"
      - "ALWLIBUPD(*NO)"
      - "ALWRINZ(*NO)"
