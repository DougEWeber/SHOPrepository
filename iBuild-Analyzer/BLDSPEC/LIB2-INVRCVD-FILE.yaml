    objattr: DSPF
    protected: no
    excluded: no
    requisites :
      -
        name: QDDSSRC
        lib: "*LIBL"
        objtype: "FILE"
        member: INVRCVD
      -
        name: INVMSTL1
        lib: "*LIBL"
        objtype: "FILE"
    requisiteyamlrecords :
      - LIBL-QDDSSRC-SRCMBR-INVRCVD
      - LIB2-INVMSTL1-FILE
    command: EDOCRTOBJ
    parameters:
      - "BLDTGT($(LIB2)/INVRCVD)"
      - "OBJTYPE(*FILE)"
      - "OBJATTR(DSPF)"
      - "CMD(CRTDSPF)"
      - "CMDPARMS(' FILE($(LIB2)/INVRCVD) SRCFILE(QDDSSRC) SRCMBR(INVRCVD) DFRWRT(*YES) RSTDSP(*NO) TEXT(''Inventory Receive Display'')')"
  LIBL-QDDSSRC-SRCMBR-INVRCVD :
    objlib: "*LIBL"
    objname: QDDSSRC
    objtype: SRCMBR
    mbrname: INVRCVD
