      - "SRCFILE(QRPGLESRC)"
      - "SRCMBR(POMAIN)"
      - "TGTCCSID(37)"
      - "PRFDTA(*NOCOL)"
      - "SRTSEQ(*HEX)"
      - "LANGID(*JOBRUN)"
