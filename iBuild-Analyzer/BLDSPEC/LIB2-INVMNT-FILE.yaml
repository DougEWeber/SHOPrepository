---
targets:
  LIB2-INVMNT-FILE :
    objlib: LIB2
    objname: INVMNT
    objtype: FILE
    objattr: DSPF
    protected: no
    excluded: no
    requisites :
      -
        name: QDDSSRC
        lib: "*LIBL"
        objtype: "FILE"
        member: INVMNT
      -
        name: INVMSTL1
        lib: "*LIBL"
        objtype: "FILE"
    requisiteyamlrecords :
      - LIBL-QDDSSRC-SRCMBR-INVMNT
      - LIB2-INVMSTL1-FILE
    command: EDOCRTOBJ
    parameters:
      - "BLDTGT($(LIB2)/INVMNT)"
      - "OBJTYPE(*FILE)"
      - "OBJATTR(DSPF)"
      - "CMD(CRTDSPF)"
      - "CMDPARMS(' FILE($(LIB2)/INVMNT) SRCFILE(QDDSSRC) SRCMBR(INVMNT) DFRWRT(*YES) RSTDSP(*NO) TEXT(''Inventory Maintenance Display'')')"
  LIBL-QDDSSRC-SRCMBR-INVMNT :
    objlib: "*LIBL"
    objname: QDDSSRC
    objtype: SRCMBR
    mbrname: INVMNT
