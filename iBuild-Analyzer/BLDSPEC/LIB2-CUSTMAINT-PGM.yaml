---
targets:
  LIB2-CUSTMAINT-PGM :
    objlib: LIB2
    objname: CUSTMAINT
    objtype: PGM
    objattr: RPGLE
    protected: no
    excluded: no
    requisites :
      -
        name: CUSMAIN
        lib: "*LIBL"
        objtype: "MODULE"
      -
        name: CUSMNT
        lib: "*LIBL"
        objtype: "MODULE"
      -
        name: SCHNAM
        lib: "*LIBL"
        objtype: "MODULE"
      -
        name: SCHZIP
        lib: "*LIBL"
        objtype: "MODULE"
    requisiteyamlrecords :
      - LIB2-CUSMNT-MODULE
      - LIB2-SCHNAM-MODULE
    command: CRTPGM
    parameters:
      - "PGM($(LIB2)/CUSTMAINT)"
      - "USRPRF(*USER)"
      - "MODULE(*LIBL/CUSMAIN CUSMNT SCHNAM *LIBL/SCHZIP)"
      - "ENTMOD(CUSMAIN)"
      - "ACTGRP(QILE)"
      - "DETAIL(*BASIC)"
      - "ALWUPD(*YES)"
      - "ALWLIBUPD(*NO)"
      - "ALWRINZ(*NO)"
