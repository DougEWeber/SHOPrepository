---
targets:
  LIB2-VNDMAINT-PGM :
    objlib: LIB2
    objname: VNDMAINT
    objtype: PGM
    objattr: RPGLE
    protected: no
    excluded: no
    requisites :
      -
        name: VNDMAIN
        lib: "*LIBL"
        objtype: "MODULE"
      -
        name: VNDMNT
        lib: "*LIBL"
        objtype: "MODULE"
    requisiteyamlrecords :
      - LIB2-VNDMAIN-MODULE
      - LIB2-VNDMNT-MODULE
    command: CRTPGM
    parameters:
      - "PGM($(LIB2)/VNDMAINT)"
      - "USRPRF(*USER)"
      - "MODULE(VNDMAIN VNDMNT)"
      - "ENTMOD(VNDMAIN)"
      - "ACTGRP(QILE)"
      - "DETAIL(*BASIC)"
      - "ALWUPD(*YES)"
      - "ALWLIBUPD(*NO)"
      - "ALWRINZ(*NO)"
