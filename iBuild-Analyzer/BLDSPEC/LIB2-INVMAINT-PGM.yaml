---
targets:
  LIB2-INVMAINT-PGM :
    objlib: LIB2
    objname: INVMAINT
    objtype: PGM
    objattr: RPGLE
    protected: no
    excluded: no
    requisites :
      -
        name: INVMAIN
        lib: "*LIBL"
        objtype: "MODULE"
      -
        name: INVMNT
        lib: "*LIBL"
        objtype: "MODULE"
      -
        name: INVRCV
        lib: "*LIBL"
        objtype: "MODULE"
    requisiteyamlrecords :
      - LIB2-INVMAIN-MODULE
      - LIB2-INVMNT-MODULE
      - LIB2-INVRCV-MODULE
    command: CRTPGM
    parameters:
      - "PGM($(LIB2)/INVMAINT)"
      - "USRPRF(*USER)"
      - "MODULE(INVMAIN INVMNT INVRCV)"
      - "ENTMOD(INVMAIN)"
      - "ACTGRP(QILE)"
      - "DETAIL(*BASIC)"
      - "ALWUPD(*YES)"
      - "ALWLIBUPD(*NO)"
      - "ALWRINZ(*NO)"
