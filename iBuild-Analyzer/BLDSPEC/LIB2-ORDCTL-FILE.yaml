---
targets:
  LIB2-ORDCTL-FILE :
    objlib: LIB2
    objname: ORDCTL
    objtype: FILE
    objattr: PF
    protected: no
    excluded: no
    requisites :
      -
        name: QDDSSRC
        lib: "*LIBL"
        objtype: "FILE"
        member: ORDCTL
    requisiteyamlrecords :
      - LIBL-QDDSSRC-SRCMBR-ORDCTL
    command: EDOCRTOBJ
    parameters:
      - "BLDTGT($(LIB2)/ORDCTL)"
      - "OBJTYPE(*FILE)"
      - "OBJATTR(PF)"
      - "CMD(CRTPF)"
      - "CMDPARMS(' FILE($(LIB2)/ORDCTL) SRCFILE(QDDSSRC) SRCMBR(ORDCTL) TEXT(''Order Number Control'')')"
  LIBL-QDDSSRC-SRCMBR-ORDCTL :
    objlib: "*LIBL"
    objname: QDDSSRC
    objtype: SRCMBR
    mbrname: ORDCTL
